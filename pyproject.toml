[project]
name = "fingrid-py"
version = "0.2.0"
description = "Python client for Fingrid API"
readme = "README.md"
keywords = [
    "fingrid", 
    "fingrid-py", 
    "py-fingrid", 
    "fingrid-api", 
    "fingrid API", 
    "fingrid avoindata"
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "pyright>=1.1.408",
    "pytest>=8.4.2",
    "python-dotenv>=1.2.1",
    "requests-mock>=1.12.1",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
addopts = ["-v", "--ignore=tests/test_integration.py"]

[tool.ruff]
line-length = 88
indent-width = 4
include = ["fingrid/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "C"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 72
skip-magic-trailing-comma = false

[tool.deptry]
ignore_notebooks = true
requirements_files = ["requirements.txt", "requirements-dev.txt"]

[tool.pyright]
include = ["fingrid/*.py"]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "fingrid"
